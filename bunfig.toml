[fmt]
sortPackageJson = true
sortTailwindcss = true
jsdoc = true
# bun fmt reads only the root .gitignore, so generated output is listed here.
ignorePatterns = [
  "**/*.gen.*",
  # Astro: bun fmt cannot format these — Biome handles them (see biome.json).
  "**/*.astro",
  "**/bun.lock",
  "**/node_modules/",
  "**/dist/",
  "**/storybook-static/",
  "**/.astro/",
  "**/.turbo/",
  "**/CHANGELOG.md",
]

[lint]
ignorePatterns = [
  "**/*.gen.*",
  "**/dist/",
  "**/storybook-static/",
  "**/.astro/",
  "**/.turbo/",
]

[lint.rules]
"import/no-cycle" = "error"
"no-restricted-imports" = [
  "error",
  { patterns = [
    { group = ["@*/*/**", "phosphor-svelte/lib/**", "!@pisagor/*/styles", "!@pisagor/*/icons", "!@pisagor/*/utils", "!@pisagor/*/hooks", "!@pisagor/*/data-grid", "!@pisagor/*/data-table", "!@pisagor/*/phone-input", "!@pisagor/*/rich-text-editor", "!@pisagor/*/tanstack", "!@pisagor/presets/pisagor", "!@modelcontextprotocol/sdk/**", "!@squidlab/phosphor-solid/icons", "!@storybook/*/node", "!@tanstack/highlight/**"], message = "Import from the package barrel. Subpaths are only for CSS, separate entries, or names missing from the root (see .rulesync component rules)." },
  ] },
]

[[lint.overrides]]
files = ["**/*.test.{ts,tsx}", "**/*.spec.{ts,tsx}"]
rules = { "@typescript-eslint/no-explicit-any" = "off" }

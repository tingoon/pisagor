[fmt]
sortPackageJson = true
sortTailwindcss = true
jsdoc = true
# bun fmt reads only the root .gitignore, so generated output is listed here.
ignorePatterns = [
  "**/*.gen.*",
  # Astro: bun fmt cannot format these — Biome handles them (see biome.json).
  "**/*.astro",
  "**/bun.lock",
  "**/node_modules/",
  "**/dist/",
  "**/storybook-static/",
  "**/.astro/",
  "**/.turbo/",
  "**/CHANGELOG.md",
]

[lint]
ignorePatterns = [
  "**/*.gen.*",
  "**/dist/",
  "**/storybook-static/",
  "**/.astro/",
  "**/.turbo/",
]

[lint.rules]
"import/no-cycle" = "error"
"no-restricted-imports" = [
  "error",
  { patterns = [
    { group = ["@ark-ui/*/*"], message = "Import Ark UI from the framework barrel (@ark-ui/react, @ark-ui/vue, @ark-ui/solid, @ark-ui/svelte), never subpaths." },
  ] },
]

[[lint.overrides]]
files = ["**/*.test.{ts,tsx}", "**/*.spec.{ts,tsx}"]
rules = { "@typescript-eslint/no-explicit-any" = "off" }

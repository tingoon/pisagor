pre-commit:
  parallel: true
  commands:
    fmt:
      run: bun fmt --staged
    lint:
      run: bunx biome lint --no-errors-on-unmatched {staged_files}
    biome:
      glob: "*.{astro,css,json,jsonc,svelte,vue}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

pre-push:
  commands:
    typecheck:
      run: bun run typecheck

post-merge:
  commands:
    install-dependencies:
      files: git diff-tree -r --name-only --no-commit-id ORIG_HEAD HEAD
      glob: [bun.lock]
      run: bun install --frozen-lockfile

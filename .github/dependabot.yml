version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly
    assignees:
      - "cursor[bot]"
    commit-message:
      prefix: "chore"

updates:
  - package-ecosystem: bun
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: all-dependencies

  - package-ecosystem: github-actions
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: all-dependencies

  - package-ecosystem: docker
    directory: /.devcontainer
    patterns:
      - "*"
    multi-ecosystem-group: all-dependencies

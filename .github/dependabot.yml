version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"

updates:
  - package-ecosystem: bun
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: dependencies

  - package-ecosystem: github-actions
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: dependencies

  - package-ecosystem: docker
    directory: /.devcontainer
    patterns:
      - "*"
    multi-ecosystem-group: dependencies

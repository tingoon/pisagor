name: Feature request
description: Suggest a new capability or improvement
title: "feat: "
labels: [enhancement]
body:
  - type: input
    id: package
    attributes:
      label: Package
      description: Which package? (`@pisagor/react`, `@pisagor/vue`, …)
      placeholder: "@pisagor/react"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: What you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any other approaches.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots or Storybook references.
    validations:
      required: false

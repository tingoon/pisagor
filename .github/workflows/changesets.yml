name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: changesets
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Ensure npm supports OIDC
        run: npm install -g npm@latest

      - name: Create version PR or publish
        uses: changesets/action@v2.1.2
        with:
          version-script: bunx changeset version
          publish-script: bunx changeset publish
          pr-title: "chore: apply changesets"
          commit-message: "chore: apply changesets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

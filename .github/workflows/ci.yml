name: Checks

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-turborepo
      - uses: ./.github/actions/setup-bun
      - run: bunx biome ci
      - run: bunx knip
      - run: bun run type-check
      - run: bun run test
      - run: bun run build

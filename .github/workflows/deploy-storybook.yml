name: Deploy Storybook

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-storybook
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Build React Storybook
        run: bunx turbo build --filter=react-stories
        env:
          STORYBOOK_BASE_PATH: /${{ github.event.repository.name }}/react/
      - name: Build Vue Storybook
        run: bunx turbo build --filter=vue-stories
        env:
          STORYBOOK_BASE_PATH: /${{ github.event.repository.name }}/vue/
      - name: Build Astro Storybook
        run: bunx turbo build --filter=astro-stories
        env:
          STORYBOOK_BASE_PATH: /${{ github.event.repository.name }}/astro/
      - name: Assemble site
        run: |
          mkdir -p site/react site/vue site/astro
          cp -R apps/react/storybook-static/. site/react/
          cp -R apps/vue/storybook-static/. site/vue/
          cp -R apps/astro/storybook-static/. site/astro/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

<?xml version="1.0" encoding="UTF-8" ?>
<svg
  aria-label="Prose anatomy"
  fill="none"
  role="img"
  viewBox="0 0 800 450"
  xmlns="http://www.w3.org/2000/svg"
>
  <title>Prose anatomy</title>
  <defs>
    <linearGradient id="glass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.56" />
    </linearGradient>
    <linearGradient id="well" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#fff" stop-opacity="0.1" />
    </linearGradient>
    <filter
      color-interpolation-filters="sRGB"
      filterUnits="userSpaceOnUse"
      height="546"
      id="lift"
      width="896"
      x="-48"
      y="-48"
    >
      <feDropShadow
        dx="0"
        dy="12"
        flood-color="#000"
        flood-opacity="0.28"
        stdDeviation="16"
      />
    </filter>
  </defs>
  <text
    fill="#fff"
    fill-opacity="1"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="40"
    font-weight="600"
    text-anchor="start"
    x="80"
    y="105"
  >
    Heading
  </text>
  <text
    fill="#fff"
    fill-opacity="0.75"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="28"
    font-weight="400"
    text-anchor="start"
    x="80"
    y="169"
  >
    Body text supports comfortable reading
  </text>
  <text
    fill="#fff"
    fill-opacity="0.75"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="28"
    font-weight="400"
    text-anchor="start"
    x="80"
    y="217"
  >
    with clear hierarchy and spacing.
  </text>
</svg>

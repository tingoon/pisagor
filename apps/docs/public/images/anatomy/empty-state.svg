<?xml version="1.0" encoding="UTF-8" ?>
<svg
  aria-label="Empty State anatomy"
  fill="none"
  role="img"
  viewBox="0 0 800 450"
  xmlns="http://www.w3.org/2000/svg"
>
  <title>Empty State anatomy</title>
  <defs>
    <linearGradient id="glass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.56" />
    </linearGradient>
    <linearGradient id="well" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#fff" stop-opacity="0.1" />
    </linearGradient>
    <filter
      color-interpolation-filters="sRGB"
      filterUnits="userSpaceOnUse"
      height="546"
      id="lift"
      width="896"
      x="-48"
      y="-48"
    >
      <feDropShadow
        dx="0"
        dy="12"
        flood-color="#000"
        flood-opacity="0.28"
        stdDeviation="16"
      />
    </filter>
  </defs>
  <text
    fill="#fff"
    fill-opacity="1"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="36"
    font-weight="600"
    text-anchor="middle"
    x="400"
    y="161"
  >
    No results
  </text>
  <text
    fill="#fff"
    fill-opacity="0.65"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="26"
    font-weight="400"
    text-anchor="middle"
    x="400"
    y="217"
  >
    Try adjusting your filters.
  </text>
  <rect
    fill="url(#glass)"
    filter="url(#lift)"
    height="64"
    rx="24"
    stroke="#fff"
    stroke-opacity="0.28"
    stroke-width="1.2"
    width="251.84000000000003"
    x="274.08"
    y="265"
  />
  <text
    fill="#fff"
    fill-opacity="1"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="28"
    font-weight="500"
    text-anchor="middle"
    x="400"
    y="307.24"
  >
    Reset filters
  </text>
</svg>

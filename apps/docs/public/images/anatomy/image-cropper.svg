<?xml version="1.0" encoding="UTF-8" ?>
<svg
  aria-label="Image Cropper anatomy"
  fill="none"
  role="img"
  viewBox="0 0 800 450"
  xmlns="http://www.w3.org/2000/svg"
>
  <title>Image Cropper anatomy</title>
  <defs>
    <linearGradient id="glass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.56" />
    </linearGradient>
    <linearGradient id="well" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#fff" stop-opacity="0.1" />
    </linearGradient>
    <filter
      color-interpolation-filters="sRGB"
      filterUnits="userSpaceOnUse"
      height="546"
      id="lift"
      width="896"
      x="-48"
      y="-48"
    >
      <feDropShadow
        dx="0"
        dy="12"
        flood-color="#000"
        flood-opacity="0.28"
        stdDeviation="16"
      />
    </filter>
  </defs>
  <rect
    fill="url(#glass)"
    filter="url(#lift)"
    height="360"
    rx="24"
    stroke="#fff"
    stroke-opacity="0.28"
    stroke-width="1.2"
    width="480"
    x="160"
    y="45"
  />
  <rect
    fill="url(#well)"
    height="312"
    rx="19.2"
    stroke="#fff"
    stroke-opacity="0.35"
    stroke-width="1.2"
    width="432"
    x="184"
    y="69"
  />
  <rect
    fill="none"
    height="200"
    rx="4"
    stroke="#fff"
    stroke-dasharray="8 6"
    width="280"
    x="256"
    y="125"
  />
</svg>

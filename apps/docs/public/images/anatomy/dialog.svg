<?xml version="1.0" encoding="UTF-8" ?>
<svg
  aria-label="Dialog anatomy"
  fill="none"
  role="img"
  viewBox="0 0 800 450"
  xmlns="http://www.w3.org/2000/svg"
>
  <title>Dialog anatomy</title>
  <defs>
    <linearGradient id="glass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.56" />
    </linearGradient>
    <linearGradient id="well" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#fff" stop-opacity="0.1" />
    </linearGradient>
    <filter
      color-interpolation-filters="sRGB"
      filterUnits="userSpaceOnUse"
      height="546"
      id="lift"
      width="896"
      x="-48"
      y="-48"
    >
      <feDropShadow
        dx="0"
        dy="12"
        flood-color="#000"
        flood-opacity="0.28"
        stdDeviation="16"
      />
    </filter>
  </defs>
  <rect fill="#000" fill-opacity="0.22" height="450" width="800" x="0" y="0" />
  <rect
    fill="url(#glass)"
    filter="url(#lift)"
    height="336"
    rx="52.8"
    stroke="#fff"
    stroke-opacity="0.28"
    stroke-width="1.2"
    width="560"
    x="120"
    y="57"
  />
  <text
    fill="#fff"
    fill-opacity="1"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="40"
    font-weight="600"
    text-anchor="start"
    x="168"
    y="141"
  >
    Edit project
  </text>
  <text
    fill="#fff"
    fill-opacity="0.65"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="28"
    font-weight="400"
    text-anchor="start"
    x="168"
    y="185"
  >
    Update your project settings.
  </text>
  <rect
    fill="url(#well)"
    filter="url(#lift)"
    height="64"
    rx="24"
    stroke="#fff"
    stroke-opacity="0.35"
    stroke-width="1.2"
    width="464"
    x="168"
    y="217"
  />
  <text
    fill="#fff"
    fill-opacity="0.7"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="28"
    font-weight="400"
    text-anchor="start"
    x="192"
    y="259.24"
  >
    Project name
  </text>
  <rect
    fill="url(#glass)"
    filter="url(#lift)"
    height="64"
    rx="24"
    stroke="#fff"
    stroke-opacity="0.28"
    stroke-width="1.2"
    width="142.08"
    x="363.19999999999993"
    y="281"
  />
  <text
    fill="#fff"
    fill-opacity="1"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="28"
    font-weight="500"
    text-anchor="middle"
    x="434.23999999999995"
    y="323.24"
  >
    Cancel
  </text>
  <rect
    fill="url(#glass)"
    filter="url(#lift)"
    height="64"
    rx="24"
    stroke="#fff"
    stroke-opacity="0.28"
    stroke-width="1.2"
    width="110.72"
    x="521.28"
    y="281"
  />
  <text
    fill="#fff"
    fill-opacity="1"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="28"
    font-weight="500"
    text-anchor="middle"
    x="576.64"
    y="323.24"
  >
    Save
  </text>
</svg>

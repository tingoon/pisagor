<?xml version="1.0" encoding="UTF-8" ?>
<svg
  aria-label="Command anatomy"
  fill="none"
  role="img"
  viewBox="0 0 800 450"
  xmlns="http://www.w3.org/2000/svg"
>
  <title>Command anatomy</title>
  <defs>
    <linearGradient id="glass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.56" />
    </linearGradient>
    <linearGradient id="well" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#fff" stop-opacity="0.1" />
    </linearGradient>
    <filter
      color-interpolation-filters="sRGB"
      filterUnits="userSpaceOnUse"
      height="546"
      id="lift"
      width="896"
      x="-48"
      y="-48"
    >
      <feDropShadow
        dx="0"
        dy="12"
        flood-color="#000"
        flood-opacity="0.28"
        stdDeviation="16"
      />
    </filter>
  </defs>
  <rect fill="#000" fill-opacity="0.18" height="450" width="800" x="0" y="0" />
  <rect
    fill="url(#glass)"
    filter="url(#lift)"
    height="440"
    rx="43.2"
    stroke="#fff"
    stroke-opacity="0.28"
    stroke-width="1.2"
    width="720"
    x="40"
    y="5"
  />
  <rect
    fill="url(#well)"
    height="64"
    rx="24"
    stroke="#fff"
    stroke-opacity="0.35"
    stroke-width="1.2"
    width="672"
    x="64"
    y="29"
  />
  <text
    fill="#fff"
    fill-opacity="0.65"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="28"
    font-weight="400"
    text-anchor="start"
    x="88"
    y="73"
  >
    Type a command…
  </text>
  <rect
    fill="#fff"
    fill-opacity="0.12"
    height="64"
    rx="19.2"
    width="672"
    x="64"
    y="125"
  />
  <text
    fill="#fff"
    fill-opacity="1"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="28"
    font-weight="500"
    text-anchor="start"
    x="88"
    y="169"
  >
    Open file
  </text>

  <text
    fill="#fff"
    fill-opacity="1"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="28"
    font-weight="500"
    text-anchor="start"
    x="88"
    y="241"
  >
    Search docs
  </text>

  <text
    fill="#fff"
    fill-opacity="1"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="28"
    font-weight="500"
    text-anchor="start"
    x="88"
    y="313"
  >
    Toggle theme
  </text>
</svg>

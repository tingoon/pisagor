<?xml version="1.0" encoding="UTF-8" ?>
<svg
  aria-label="Alert Dialog anatomy"
  fill="none"
  role="img"
  viewBox="0 0 800 450"
  xmlns="http://www.w3.org/2000/svg"
>
  <title>Alert Dialog anatomy</title>
  <defs>
    <linearGradient id="glass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.56" />
    </linearGradient>
    <linearGradient id="well" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#fff" stop-opacity="0.1" />
    </linearGradient>
    <filter
      color-interpolation-filters="sRGB"
      filterUnits="userSpaceOnUse"
      height="546"
      id="lift"
      width="896"
      x="-48"
      y="-48"
    >
      <feDropShadow
        dx="0"
        dy="12"
        flood-color="#000"
        flood-opacity="0.28"
        stdDeviation="16"
      />
    </filter>
  </defs>
  <rect fill="#000" fill-opacity="0.22" height="450" width="800" x="0" y="0" />
  <rect
    fill="url(#glass)"
    filter="url(#lift)"
    height="264"
    rx="52.8"
    stroke="#fff"
    stroke-opacity="0.28"
    stroke-width="1.2"
    width="520"
    x="140"
    y="93"
  />
  <text
    fill="#fff"
    fill-opacity="1"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="40"
    font-weight="600"
    text-anchor="start"
    x="188"
    y="177"
  >
    Delete project?
  </text>
  <text
    fill="#fff"
    fill-opacity="0.65"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="28"
    font-weight="400"
    text-anchor="start"
    x="188"
    y="225"
  >
    This action cannot be undone.
  </text>
  <rect
    fill="url(#glass)"
    filter="url(#lift)"
    height="64"
    rx="24"
    stroke="#fff"
    stroke-opacity="0.28"
    stroke-width="1.2"
    width="142.08"
    x="311.8399999999999"
    y="245"
  />
  <text
    fill="#fff"
    fill-opacity="1"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="28"
    font-weight="500"
    text-anchor="middle"
    x="382.87999999999994"
    y="287.24"
  >
    Cancel
  </text>
  <rect
    fill="url(#glass)"
    filter="url(#lift)"
    height="64"
    rx="24"
    stroke="#fff"
    stroke-opacity="0.28"
    stroke-width="1.2"
    width="142.08"
    x="469.91999999999996"
    y="245"
  />
  <text
    fill="#fff"
    fill-opacity="1"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="28"
    font-weight="500"
    text-anchor="middle"
    x="540.9599999999999"
    y="287.24"
  >
    Delete
  </text>
</svg>

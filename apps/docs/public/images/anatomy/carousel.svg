<?xml version="1.0" encoding="UTF-8" ?>
<svg
  aria-label="Carousel anatomy"
  fill="none"
  role="img"
  viewBox="0 0 800 450"
  xmlns="http://www.w3.org/2000/svg"
>
  <title>Carousel anatomy</title>
  <defs>
    <linearGradient id="glass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.56" />
    </linearGradient>
    <linearGradient id="well" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#fff" stop-opacity="0.1" />
    </linearGradient>
    <filter
      color-interpolation-filters="sRGB"
      filterUnits="userSpaceOnUse"
      height="546"
      id="lift"
      width="896"
      x="-48"
      y="-48"
    >
      <feDropShadow
        dx="0"
        dy="12"
        flood-color="#000"
        flood-opacity="0.28"
        stdDeviation="16"
      />
    </filter>
  </defs>
  <rect
    fill="url(#glass)"
    filter="url(#lift)"
    height="360"
    rx="43.2"
    stroke="#fff"
    stroke-opacity="0.28"
    stroke-width="1.2"
    width="640"
    x="80"
    y="45"
  />
  <rect
    fill="url(#well)"
    height="264"
    rx="24"
    stroke="#fff"
    stroke-opacity="0.35"
    stroke-width="1.2"
    width="576"
    x="112"
    y="77"
  />
  <circle cx="368" cy="373" fill="#fff" fill-opacity="0.35" r="6" />
  <circle cx="400" cy="373" fill="#fff" r="6" />
  <circle cx="432" cy="373" fill="#fff" fill-opacity="0.35" r="6" />
</svg>

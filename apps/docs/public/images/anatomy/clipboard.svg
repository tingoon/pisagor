<?xml version="1.0" encoding="UTF-8" ?>
<svg
  aria-label="Clipboard anatomy"
  fill="none"
  role="img"
  viewBox="0 0 800 450"
  xmlns="http://www.w3.org/2000/svg"
>
  <title>Clipboard anatomy</title>
  <defs>
    <linearGradient id="glass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.56" />
    </linearGradient>
    <linearGradient id="well" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#fff" stop-opacity="0.1" />
    </linearGradient>
    <filter
      color-interpolation-filters="sRGB"
      filterUnits="userSpaceOnUse"
      height="546"
      id="lift"
      width="896"
      x="-48"
      y="-48"
    >
      <feDropShadow
        dx="0"
        dy="12"
        flood-color="#000"
        flood-opacity="0.28"
        stdDeviation="16"
      />
    </filter>
  </defs>
  <rect
    fill="url(#well)"
    filter="url(#lift)"
    height="64"
    rx="24"
    stroke="#fff"
    stroke-opacity="0.35"
    stroke-width="1.2"
    width="560"
    x="120"
    y="193"
  />
  <text
    fill="#fff"
    fill-opacity="1"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="26"
    font-weight="500"
    text-anchor="start"
    x="144"
    y="235.24"
  >
    npm i @pisagor/react
  </text>
  <rect
    fill="url(#well)"
    height="56"
    rx="19.2"
    stroke="#fff"
    stroke-opacity="0.35"
    stroke-width="1.2"
    width="56"
    x="608"
    y="197"
  />
  <g
    fill="none"
    stroke="#fff"
    stroke-width="2.8"
    transform="translate(620 209)"
  >
    <rect height="28" rx="4" width="24" x="0" y="6" />
    <rect height="28" rx="4" width="24" x="8" y="0" />
  </g>
</svg>

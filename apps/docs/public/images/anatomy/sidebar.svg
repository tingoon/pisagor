<?xml version="1.0" encoding="UTF-8" ?>
<svg
  aria-label="Sidebar anatomy"
  fill="none"
  role="img"
  viewBox="0 0 800 450"
  xmlns="http://www.w3.org/2000/svg"
>
  <title>Sidebar anatomy</title>
  <defs>
    <linearGradient id="glass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.56" />
    </linearGradient>
    <linearGradient id="well" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#fff" stop-opacity="0.1" />
    </linearGradient>
    <filter
      color-interpolation-filters="sRGB"
      filterUnits="userSpaceOnUse"
      height="546"
      id="lift"
      width="896"
      x="-48"
      y="-48"
    >
      <feDropShadow
        dx="0"
        dy="12"
        flood-color="#000"
        flood-opacity="0.28"
        stdDeviation="16"
      />
    </filter>
  </defs>
  <rect
    fill="url(#glass)"
    filter="url(#lift)"
    height="560"
    rx="43.2"
    stroke="#fff"
    stroke-opacity="0.28"
    stroke-width="1.2"
    width="400"
    x="-40"
    y="-55"
  />
  <text
    fill="#fff"
    fill-opacity="0.65"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="26"
    font-weight="500"
    text-anchor="start"
    x="-8"
    y="1"
  >
    Workspace
  </text>

  <text
    fill="#fff"
    fill-opacity="1"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="28"
    font-weight="500"
    text-anchor="start"
    x="0"
    y="81"
  >
    Home
  </text>
  <rect
    fill="#fff"
    fill-opacity="0.14"
    height="64"
    rx="19.2"
    width="368"
    x="-24"
    y="113"
  />
  <text
    fill="#fff"
    fill-opacity="1"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="28"
    font-weight="500"
    text-anchor="start"
    x="0"
    y="153"
  >
    Projects
  </text>

  <text
    fill="#fff"
    fill-opacity="1"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="28"
    font-weight="500"
    text-anchor="start"
    x="0"
    y="225"
  >
    Settings
  </text>

  <text
    fill="#fff"
    fill-opacity="1"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="28"
    font-weight="500"
    text-anchor="start"
    x="0"
    y="297"
  >
    Team
  </text>

  <text
    fill="#fff"
    fill-opacity="1"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="28"
    font-weight="500"
    text-anchor="start"
    x="0"
    y="369"
  >
    Billing
  </text>
  <rect
    fill="url(#well)"
    height="560"
    rx="43.2"
    stroke="#fff"
    stroke-opacity="0.35"
    stroke-width="1.2"
    width="440"
    x="392"
    y="-55"
  />
</svg>

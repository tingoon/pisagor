<?xml version="1.0" encoding="UTF-8" ?>
<svg
  aria-label="Timeline anatomy"
  fill="none"
  role="img"
  viewBox="0 0 800 450"
  xmlns="http://www.w3.org/2000/svg"
>
  <title>Timeline anatomy</title>
  <defs>
    <linearGradient id="glass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.56" />
    </linearGradient>
    <linearGradient id="well" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#fff" stop-opacity="0.1" />
    </linearGradient>
    <filter
      color-interpolation-filters="sRGB"
      filterUnits="userSpaceOnUse"
      height="546"
      id="lift"
      width="896"
      x="-48"
      y="-48"
    >
      <feDropShadow
        dx="0"
        dy="12"
        flood-color="#000"
        flood-opacity="0.28"
        stdDeviation="16"
      />
    </filter>
  </defs>
  <line
    stroke="#fff"
    stroke-opacity="0.3"
    stroke-width="4"
    x1="216"
    x2="216"
    y1="65"
    y2="345"
  />
  <circle cx="216" cy="65" fill="#fff" r="10" />
  <text
    fill="#fff"
    fill-opacity="1"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="28"
    font-weight="500"
    text-anchor="start"
    x="256"
    y="73"
  >
    Shipped
  </text>
  <circle cx="216" cy="169" fill="#fff" r="10" />
  <text
    fill="#fff"
    fill-opacity="1"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="28"
    font-weight="500"
    text-anchor="start"
    x="256"
    y="177"
  >
    In transit
  </text>
  <circle cx="216" cy="273" fill="#fff" r="10" />
  <text
    fill="#fff"
    fill-opacity="1"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="28"
    font-weight="500"
    text-anchor="start"
    x="256"
    y="281"
  >
    Delivered
  </text>
</svg>
